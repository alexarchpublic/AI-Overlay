appId: com.archpublic.ai-overlay
productName: Arch Public AI Overlay
copyright: Copyright © 2026 Arch Public

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - node_modules/**/*

asar: true

# Native binaries and worker-thread entrypoints cannot be loaded from inside an
# asar archive and must stay unpacked:
#   sharp / @img  — platform native binding (.node) plus libvips
#                   (libvips-cpp.42.dylib on macOS, libvips-42.dll on Windows).
#   pino chain    — pino transports spawn a thread-stream worker that resolves
#                   its target module from disk at runtime. See Chunk 7 §3.7 B3.
# The trailing `/**/*` is required — `node_modules/sharp/**` matches only the
# directory entry in some electron-builder versions, leaving files in the asar.
# Do NOT use a `pino*` glob — it would also unpack pino-pretty, which is removed
# from the packaged path (Phase 1.1 / B3).
asarUnpack:
  - "node_modules/sharp/**/*"
  - "node_modules/@img/**/*"
  - "node_modules/pino/**/*"
  - "node_modules/pino-std-serializers/**/*"
  - "node_modules/thread-stream/**/*"
  - "node_modules/sonic-boom/**/*"

extraResources:
  - from: knowledge/bundles
    to: knowledge/bundles
    filter: ["**/*"]

publish:
  provider: github
  owner: alexarchpublic
  repo: AI-Overlay-releases
  # Published as a normal GitHub Release (not "prerelease") so /releases/latest
  # and the repo sidebar "Latest" widget resolve. Alpha status is carried by the
  # package.json version suffix (0.x.y-alpha.N), not the GitHub prerelease flag.
  # GitHub-prerelease-only publishes hide Latest and 404 electron-updater's
  # .../releases/latest/download/latest.yml path.
  releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: ArchPublicAIOverlay-Setup-${version}.${ext}
  # Signing is intentionally absent (Chunk 7 D2). When a cert exists, CI supplies
  # WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD and electron-builder signs with no config
  # change here.

nsis:
  oneClick: false
  perMachine: false          # per-user install → no UAC → silent auto-update (D8)
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Arch Public AI Overlay
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

mac:
  category: public.app-category.finance
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip           # REQUIRED for latest-mac.yml generation
      arch: [arm64]
  artifactName: ArchPublicAIOverlay-${version}-${arch}.${ext}
  # Unsigned + un-notarized (Chunk 7 D2). Consequence: macOS is notify-only (D7),
  # and first launch requires right-click → Open.
