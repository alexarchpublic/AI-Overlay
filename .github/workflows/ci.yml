name: CI

on:
  push:
    branches: [main, dev, pivot/internal-copilot, chunk-7/packaging-windows]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Coverage only on macOS to save minutes (Chunk 7 §5.1).
      - name: Coverage
        if: runner.os == 'macOS'
        run: npm run test:coverage
